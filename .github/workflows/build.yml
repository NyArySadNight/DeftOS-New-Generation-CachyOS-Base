name: Build ISO

on:
  push:
    branches: [main, cachyos]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO with mkarchiso
        run: |
          docker run --privileged --rm -v "$PWD:/src" -w /src archlinux:latest bash -c "
            pacman -Syu --noconfirm archiso grub &&
            mkarchiso -v -w /src/work -o /src/out /src/profile
          "

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ github.ref_name }}
          path: out/*.iso
          retention-days: 3
