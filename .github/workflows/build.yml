name: Build CachyOS ISO (base)

on:
  push:
    branches: [main]
    paths: ["profile/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Build ISO with mkarchiso
        run: |
          docker run --privileged --rm -v "$PWD:/src" -w /src archlinux:latest bash -c "
            set -e
            printf '\n[cachyos]\nSigLevel = Optional TrustAll\nServer = https://mirror.cachyos.org/repo/\$arch/\$repo\n' >> /etc/pacman.conf
            pacman -Syu --noconfirm archiso grub python &&
            pacman -Sql | sort -u > /src/avail.txt &&
            cp -r /src/profile /src/profile-ci &&
            python3 /src/scripts/filter-packages.py /src/profile/packages.x86_64 /src/profile-ci/packages.x86_64 /src/dropped.txt &&
            echo "dropped: $(wc -l < /src/dropped.txt)" &&
            mkarchiso -v -w /src/work -o /src/out /src/profile-ci
          "

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-base-iso
          path: out/*.iso
          retention-days: 7

      - name: Upload dropped package list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-dropped-packages
          path: dropped.txt
          if-no-files-found: ignore
